name: Check official Life Linux version
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Report version; fail on invalid official metadata
        run: python3 scripts/check-upstream.py | tee -a "$GITHUB_STEP_SUMMARY"
